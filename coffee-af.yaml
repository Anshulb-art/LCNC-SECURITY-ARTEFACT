env:
  contexts:
    - name: CoffeeContext
      urls:
        - "http://host.docker.internal:8080/"
      includePaths:
        - "http://host.docker.internal:8080/.*"
      authentication:
        method: form
        parameters:
          loginUrl: "http://host.docker.internal:8080/login.html"
          loginRequestData: "username={%username%}&password={%password%}"
        verification:
          method: response
          loggedInRegex: "(?i)logout|sign\\s*out|welcome|order"
          loggedOutRegex: "(?i)login|sign\\s*in"
      sessionManagement:
        method: cookie
      users:
        - name: Customer-Jack
          credentials: { username: "Jack", password: "HvvG5JSD9z" }
        - name: Engineer-Bill
          credentials: { username: "Bill", password: "tGovGHz1r3" }

  parameters:
    failOnError: true
    progressToStdout: true

  # AF vars live under env.vars and are referenced as http://host.docker.internal:8080/
  vars:
    target: "http://host.docker.internal:8080/"

jobs:
  # Crawl as Customer
  - type: spider
    parameters:
      context: "CoffeeContext"
      url: "http://host.docker.internal:8080/"
      maxDuration: 6
      maxChildren: 0
      user: "Customer-Jack"

  - type: spiderAjax
    parameters:
      context: "CoffeeContext"
      url: "http://host.docker.internal:8080/"
      maxDuration: 6
      user: "Customer-Jack"

  # Crawl as Engineer
  - type: spider
    parameters:
      context: "CoffeeContext"
      url: "http://host.docker.internal:8080/"
      maxDuration: 4
      maxChildren: 0
      user: "Engineer-Bill"

  - type: spiderAjax
    parameters:
      context: "CoffeeContext"
      url: "http://host.docker.internal:8080/"
      maxDuration: 4
      user: "Engineer-Bill"

  # Finish passive
  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  # Active scan (Top 10 style)
  - type: activeScan
    parameters:
      context: "CoffeeContext"
      policy: "Default Policy"
      maxRuleDurationInMins: 6
      maxScanDurationInMins: 35
      addQueryParam: true
      delayInMs: 0
      user: "Customer-Jack"

  # Reports
  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "reports"
      reportFile: "zap-coffee-top10.html"
      displayReport: false

  - type: report
    parameters:
      template: "modern"
      reportDir: "reports"
      reportFile: "zap-coffee-modern.html"
      displayReport: false

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "reports"
      reportFile: "zap-coffee.json"
      displayReport: false
  - type: activeScan
    parameters:
      context: "CoffeeContext"
      policy: "Default Policy"
      maxRuleDurationInMins: 6
      maxScanDurationInMins: 35
      addQueryParam: true
      delayInMs: 0
      user: "Engineer-Bill"
