env:
  contexts:
    - name: CoffeeContext
      urls: [ "http://host.docker.internal:8080/" ]
      includePaths: [ "http://host.docker.internal:8080/.*" ]
      authentication:
        method: form
        parameters:
          loginUrl: "http://host.docker.internal:8080/login.html"
          loginRequestData: "username={%username%}&password={%password%}"
        verification:
          method: response
          loggedInRegex: "(?i)logout|welcome|order"
          loggedOutRegex: "(?i)login|sign\\s*in"
      sessionManagement:
        method: cookie
      users:
        - name: Customer-Jack
          credentials: { username: "Jack", password: "HvvG5JSD9z" }

  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  # Light crawl as logged-in user
  - type: spider
    parameters:
      context: "CoffeeContext"
      url: "http://host.docker.internal:8080/"
      user: "Customer-Jack"
      maxDuration: 8
      maxChildren: 0

  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  # Define a custom policy with stronger settings
  - type: activeScan
    parameters:
      context: "CoffeeContext"
      user: "Customer-Jack"
      policy: "AggressivePolicy"
      # durations keep the run bounded
      maxRuleDurationInMins: 8
      maxScanDurationInMins: 45
    policyDefinition:
      name: "AggressivePolicy"
      defaultStrength: "High"
      defaultThreshold: "Low"
      rules: []  # add per-rule overrides here if you want

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "reports"
      reportFile: "zap-active-attack.html"
      displayReport: false
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "reports"
      reportFile: "zap-active-attack.json"
      displayReport: false
